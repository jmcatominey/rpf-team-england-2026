<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team England 2026 | Digital Maker</title>
  <!-- Bootstrap 5.3.3 loaded from a CDN, so no local stylesheet is needed -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- container: centred column with a sensible maximum width. text-center centres the text. -->
  <main class="container text-center py-3">

    <!-- Grid: the page content takes 8 of 12 columns on tablets and up, and all of it on phones -->
    <div class="row justify-content-center"><div class="col-12 col-md-8">

    <!-- d-flex puts the logos in a row; justify-content-between pushes them to opposite ends -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <img src="rpflogo.png" width="200" class="img-fluid" alt="Raspberry Pi Foundation">
      <img src="dmbadge.png" width="90" class="img-fluid" alt="Scouts Digital Maker badge">
    </header>

    <h1 class="h1 mb-3">Team England November 2026</h1>
    <h2 class="h2 mb-5">Digital maker links</h2>

    <!-- d-inline-grid makes one shared column as wide as the widest button, so every button
         matches it. text-center on the page centres the block; gap-3 spaces the buttons out. -->
    <nav class="d-inline-grid gap-3">
      <a class="btn btn-primary btn-lg mb-2" target="_blank" rel="noopener" href="http://rpf.io/makecode">Get started with MakeCode</a>
      <a class="btn btn-primary btn-lg mb-2" target="_blank" rel="noopener" href="https://docs.google.com/document/d/16xNkeQVKHV0H1YNE610bV380pHPTze7_ZJQfoJujRrY/edit">Project 1 - Make a compass</a>
      <a class="btn btn-primary btn-lg mb-2" target="_blank" rel="noopener" href="https://docs.google.com/document/d/1GlpFQdJzJIhQ5TFHjRgy5y39jiVrFBaVB4h_wZQGIs0/edit">Project 2 - Send radio messages</a>
      <a class="btn btn-primary btn-lg mb-2" target="_blank" rel="noopener" href="https://docs.google.com/document/d/1v-gQ1T89rxAgcjg4IbFate18WFowMb-as_3xLYL-eeE/edit">Project 3 - Test your reactions game</a>
      <a class="btn btn-primary btn-lg mb-2" target="_blank" rel="noopener" href="https://form.raspberrypi.org/f/scouts-eoi?tfa_7952=TeamEngland">Register your interest!</a>
    </nav>

    </div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
